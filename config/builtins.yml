# Games the home page offers, in order. Each lives in public/builtins/<slug>/
# with a manifest.json, and thumbnail is a path inside that directory. A
# directory left out of this list, like aces, a sampler of what the table can
# do, is still served but never offered.
- slug: checkers
  name: Checkers
  description: Two players, twelve checkers each. Flip a checker over to crown it.
  thumbnail: thumbnail.svg
- slug: chess
  name: Chess
  description: Two players, sixteen pieces each, on discs like a magnetic travel set.
  thumbnail: thumbnail.svg
- slug: pachisi
  name: Pachisi
  description: Two to four players race four pawns each around the board and home. Roll two dice.
  thumbnail: thumbnail.svg
- slug: cards
  name: Cards
  description: A standard 52-card deck with two jokers, and a bank of poker chips. Deal, play, and bet any card game.
  thumbnail: thumbnail.svg
- slug: go
  name: Go
  description: Two players take turns placing black and white stones on a 19 by 19 board to surround territory.
  thumbnail: thumbnail.svg
- slug: global-domination
  name: Global Domination
  description: Two to six players conquer a map of 42 territories. Place armies, roll to attack, and trade in card sets for more.
  thumbnail: thumbnail.svg
